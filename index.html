<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="dashboard">

      <!-- Greeting Widget -->
      <section class="widget" id="widget-greeting" aria-label="Greeting Widget">
        <h2 id="greeting-text" class="greeting-text">Good Morning</h2>
        <p id="time-display" class="time-display">00:00:00</p>
        <p id="date-display" class="date-display">Monday, 1 January 2025</p>
      </section>

      <!-- Focus Timer Widget -->
      <section class="widget" id="widget-timer" aria-label="Focus Timer">
        <h2 class="widget-title">Focus Timer</h2>
        <p id="timer-display" class="timer-display">25:00</p>
        <div id="timer-complete" class="timer-complete" aria-live="polite" hidden>
          Session complete! Great work.
        </div>
        <div class="timer-controls">
          <button id="timer-start" type="button">Start</button>
          <button id="timer-stop" type="button" disabled>Stop</button>
          <button id="timer-reset" type="button">Reset</button>
        </div>
      </section>

      <!-- Todo List Widget -->
      <section class="widget" id="widget-todo" aria-label="Todo List">
        <h2 class="widget-title">To-Do List</h2>
        <div class="todo-input-row">
          <label for="todo-input" class="sr-only">New task</label>
          <input
            type="text"
            id="todo-input"
            placeholder="Add a new task…"
            autocomplete="off"
          />
          <button id="todo-add" type="button">Add</button>
        </div>
        <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      </section>

      <!-- Quick Links Widget -->
      <section class="widget" id="widget-links" aria-label="Quick Links">
        <h2 class="widget-title">Quick Links</h2>
        <div class="links-input-group">
          <label for="links-name" class="sr-only">Link name</label>
          <input
            type="text"
            id="links-name"
            placeholder="Name"
            autocomplete="off"
          />
          <label for="links-url" class="sr-only">Link URL</label>
          <input
            type="url"
            id="links-url"
            placeholder="https://example.com"
            autocomplete="off"
          />
          <button id="links-add" type="button">Add Link</button>
        </div>
        <p id="links-error" class="links-error" role="alert" aria-live="polite"></p>
        <div id="links-list" class="links-list" aria-label="Saved links"></div>
      </section>

    </main>

    <script src="js/app.js" defer></script>
  </body>
</html>
